<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Summit at Altitude – Coming soon</title>
<meta name="description" content="Summit at Altitude is an AI hiking companion that plans your route, reads the mountain and gets you to the top. Coming soon.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #080d1c;
    --ridge: #1a2447;
    --glacier: #6f93b8;
    --snow: #eef3f8;
    --glow: #ffb877;
    --serif: "Instrument Serif", Georgia, serif;
    --sans: "Instrument Sans", system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: var(--ink); color: var(--snow); overflow: hidden; }
  body { font-family: var(--sans); -webkit-font-smoothing: antialiased; }

  canvas#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  .vignette {
    position: fixed; inset: 0; pointer-events: none;
    background:
      radial-gradient(ellipse 65% 38% at 50% 50%, rgba(4,7,16,.5), transparent 100%),
      radial-gradient(ellipse at 50% 45%, transparent 35%, rgba(4,7,16,.65) 100%),
      linear-gradient(to bottom, rgba(4,7,16,.35), transparent 25%, transparent 60%, rgba(4,7,16,.55));
  }
  .grain {
    position: fixed; inset: -50%; pointer-events: none; opacity: .07; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    animation: grain 1.2s steps(6) infinite;
  }
  @keyframes grain {
    0% { transform: translate(0,0) } 20% { transform: translate(-3%,2%) } 40% { transform: translate(2%,-3%) }
    60% { transform: translate(-2%,-1%) } 80% { transform: translate(3%,3%) } 100% { transform: translate(0,0) }
  }

  /* letterbox bars that retract on load */
  .bar { position: fixed; left: 0; right: 0; height: 9vh; background: #03050d; z-index: 5; transition: transform 2.4s cubic-bezier(.7,0,.2,1) 3.6s; }
  .bar.top { top: 0; } .bar.bottom { bottom: 0; }
  body.ready .bar.top { transform: translateY(-100%); }
  body.ready .bar.bottom { transform: translateY(100%); }

  .altitude {
    position: fixed; z-index: 4; left: 50%; bottom: 7vh; transform: translateX(-50%);
    text-align: center; font-variant-numeric: tabular-nums; transition: opacity 1.2s ease 0s;
  }
  .altitude .num { font-family: var(--serif); font-size: clamp(2.2rem, 6vw, 4rem); letter-spacing: .02em; }
  .altitude .unit { font-size: .85rem; color: var(--glacier); margin-left: .35em; }
  .altitude .cap { display: block; font-size: .8rem; color: var(--glacier); margin-top: .2rem; }
  body.ready .altitude { opacity: 0; pointer-events: none; }

  main {
    position: fixed; inset: 0; z-index: 3; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    padding: 0 16px; gap: 1.4rem; padding-bottom: 20vh;
  }
  main > * { opacity: 0; transform: translateY(14px); transition: opacity 1.8s ease, transform 1.8s cubic-bezier(.2,.7,.2,1); }
  body.ready main > * { opacity: 1; transform: none; }
  body.ready main > :nth-child(1) { transition-delay: 0s; }
  body.ready main > :nth-child(2) { transition-delay: .5s; }
  body.ready main > :nth-child(3) { transition-delay: 1s; }
  body.ready main > :nth-child(4) { transition-delay: 1.4s; }

  .brand { font-size: .95rem; color: var(--snow); opacity: .8; letter-spacing: .04em; }
  h1 {
    font-family: var(--serif); font-weight: 400; line-height: .92; letter-spacing: -.01em;
    font-size: clamp(3.4rem, 12vw, 10.5rem);
    text-shadow: 0 6px 60px rgba(4,7,16,.7);
  }
  h1 em { display: block; font-size: .42em; letter-spacing: .02em; color: var(--glow); margin-top: .18em; }
  .lede { max-width: 34rem; font-size: clamp(1rem, 2.2vw, 1.2rem); line-height: 1.55; color: #d6e0ec; text-shadow: 0 2px 20px rgba(4,7,16,.9); }

  form { display: flex; gap: 8px; width: min(100%, 30rem); }
  input[type=email] {
    flex: 1; min-width: 0; padding: 14px 18px; border-radius: 999px;
    border: 1px solid rgba(238,243,248,.3); background: rgba(8,13,28,.55); color: var(--snow);
    font: inherit; backdrop-filter: blur(10px);
  }
  input::placeholder { color: #8ea3bb; }
  button {
    padding: 14px 22px; border-radius: 999px; border: 0; cursor: pointer;
    background: var(--glow); color: #2a1406; font: 500 1rem var(--sans);
    transition: transform .2s ease, background .2s ease;
  }
  button:hover { background: #ffc995; transform: translateY(-1px); }
  button:active { transform: translateY(0) scale(.98); }
  input:focus-visible, button:focus-visible { outline: 2px solid var(--snow); outline-offset: 3px; }
  .thanks { min-height: 1.4em; font-size: .95rem; color: var(--glow); }

  @media (max-width: 520px) {
    form { flex-direction: column; }
    .bar { height: 5vh; }
  }
  @media (prefers-reduced-motion: reduce) {
    .grain { animation: none; }
    .bar, main > * { transition-duration: .01s; transition-delay: 0s !important; }
  }
</style>
</head>
<body>
<canvas id="scene" aria-hidden="true"></canvas>
<div class="vignette"></div>
<div class="grain"></div>
<div class="bar top"></div>
<div class="bar bottom"></div>

<div class="altitude" aria-hidden="true">
  <span class="num" id="alt">0</span><span class="unit">m</span>
  <span class="cap">Climbing</span>
</div>

<main>
  <p class="brand">AI hiking companion</p>
  <h1>Summit at Altitude<em>Coming soon</em></h1>
  <p class="lede">Tell it where you want to stand. It reads the terrain, the weather and your pace, then builds the route up.</p>
  <div>
    <form id="form" novalidate>
      <input type="email" id="email" name="email" placeholder="Your email" autocomplete="email" aria-label="Email address" required>
      <button type="submit">Get early access</button>
    </form>
    <p class="thanks" id="thanks" role="status" aria-live="polite"></p>
  </div>
</main>

<script>
(() => {
  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d');
  const altEl = document.getElementById('alt');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  let W, H, dpr;
  let mouse = 0, mouseT = 0;
  const INTRO = 5200;
  const MAX_ALT = 4312;

  // seeded random so the range is the same every visit
  function rng(seed) { return () => (seed = (seed * 16807) % 2147483647) / 2147483647; }

  // ---- terrain generation ----
  function hash(ix, iy, s) {
    let h = (ix * 374761393 + iy * 668265263 + s * 1442695041) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return ((h ^ (h >>> 16)) >>> 0) / 4294967295;
  }
  function noise2(x, y, s) {
    const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
    const u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
    const a = hash(ix, iy, s), b = hash(ix + 1, iy, s), c = hash(ix, iy + 1, s), d = hash(ix + 1, iy + 1, s);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  }
  // ridged multifractal: knife-edge crests, eroded valleys, one dominant massif per range
  function makeRidge(seed, octaves, gain, freq, bump) {
    return u => {
      let sum = 0, amp = 1, w = 1, norm = 0, f = freq;
      for (let o = 0; o < octaves; o++) {
        let n = 1 - Math.abs(2 * noise2(u * f, .5, seed + o) - 1);
        n *= n; n *= w; w = Math.min(1, n * 2);
        sum += n * amp; norm += amp; amp *= gain; f *= 2.05;
      }
      let v = sum / norm;
      if (bump) v *= .6 + bump.h * Math.exp(-(((u - bump.x) / bump.w) ** 2));
      return 1 - Math.exp(-v * 2.3);
    };
  }

  // far -> near. shade/lit = colour of rock facing away from / toward the sunrise
  const layers = [
    { fn: makeRidge(11, 9, .58, 4.2, { x: .66, w: .1,  h: .55 }), base: .96, amp: .50, k: .18, shade: [66, 84, 130], lit: [205, 170, 182], haze: .55, snow: .95, trees: 0, seed: 1 },
    { fn: makeRidge(23, 9, .56, 5.0, { x: .22, w: .1, h: .4 }),  base: 1.0, amp: .42, k: .30, shade: [42, 56, 104], lit: [150, 122, 146], haze: .40, snow: .60, trees: 0, seed: 2 },
    { fn: makeRidge(37, 8, .54, 6.0),                              base: 1.04, amp: .34, k: .46, shade: [26, 36, 76],  lit: [92, 82, 112],   haze: .25, snow: .12, trees: 0, seed: 3 },
    { fn: makeRidge(51, 8, .5, 7.0),                              base: 1.08, amp: .28, k: .68, shade: [14, 20, 44], lit: [52, 52, 78],    haze: .10, snow: 0,   trees: 1, seed: 4 },
    { fn: makeRidge(67, 7, .45, 6.0),                              base: 1.12, amp: .24, k: 1.0, shade: [6, 9, 20],   lit: [26, 26, 42],    haze: 0,   snow: 0,   trees: 2, seed: 5 },
  ];

  // paint each range once into its own bitmap: lit and shadowed faces, gullies, snow, haze, pines
  function buildLayers() {
    const Wl = Math.ceil(W + 400), Hl = Math.ceil(H * 1.25);
    const HAZE = [150, 140, 178], SNOW_SHADE = [128, 150, 204], SNOW_LIT = [252, 238, 232];
    layers.forEach(L => {
      const ys = new Float32Array(Wl + 4), fv = new Float32Array(Wl + 4);
      for (let x = 0; x < Wl + 4; x++) { const f = L.fn(x / Wl); fv[x] = f; ys[x] = H * (L.base - L.amp * f); }
      L.ys = ys;
      const cv = L.cv || (L.cv = document.createElement('canvas'));
      cv.width = Wl; cv.height = Hl;
      const c = cv.getContext('2d');
      const img = c.createImageData(Wl, Hl), d = img.data;
      const S = L.shade, Lt = L.lit;
      const gullyDepth = H * .5, hazeDepth = H * .4, rimK = .15 + L.haze * .6;

      for (let x = 0; x < Wl; x++) {
        const y0 = ys[x];
        const slope = ys[Math.min(x + 3, Wl)] - ys[Math.max(x - 3, 0)]; // > 0: face descends toward the sun side
        const lit = Math.max(0, Math.min(1, .5 + slope * .05));
        const hgt = fv[x];
        const snowDepth = L.snow ? Math.max(0, hgt - .52) * H * .7 * L.snow : 0;
        for (let py = Math.max(0, Math.floor(y0)); py < Hl; py++) {
          const dep = py - y0;
          const a = dep < 0 ? 1 + dep : 1;
          const dd = dep < 0 ? 0 : dep;
          let n = .5;
          if (dd < gullyDepth) {
            n = noise2(x * .06 + dd * .09, dd * .01, L.seed) * .6 + noise2(x * .19 + dd * .22, dd * .03, L.seed + 9) * .4;
          }
          let s = lit * .6 + n * .55 - .12;
          s *= 1 - Math.min(1, dd / gullyDepth) * .55;
          s = s < 0 ? 0 : s > 1 ? 1 : s;
          let r = S[0] + (Lt[0] - S[0]) * s, g = S[1] + (Lt[1] - S[1]) * s, b = S[2] + (Lt[2] - S[2]) * s;

          if (snowDepth > 0 && dd < snowDepth * 1.5) {
            const sn = noise2(x * .07 + dd * .12, dd * .008, L.seed + 3);
            if (dd < snowDepth * (.5 + sn * .9)) {
              const ss = Math.min(1, lit * .75 + .18 + n * .2);
              r = SNOW_SHADE[0] + (SNOW_LIT[0] - SNOW_SHADE[0]) * ss;
              g = SNOW_SHADE[1] + (SNOW_LIT[1] - SNOW_SHADE[1]) * ss;
              b = SNOW_SHADE[2] + (SNOW_LIT[2] - SNOW_SHADE[2]) * ss;
            }
          }

          const hz = L.haze * (.22 + .6 * Math.min(1, dd / hazeDepth));
          r += (HAZE[0] - r) * hz; g += (HAZE[1] - g) * hz; b += (HAZE[2] - b) * hz;

          if (dd < 2.5 && lit > .45) { // sunrise rim on crests facing the glow
            const k = (1 - dd / 2.5) * (lit - .45) * 1.8 * rimK;
            r += (255 - r) * k; g += (200 - g) * k; b += (150 - b) * k;
          }
          const i4 = (py * Wl + x) * 4;
          d[i4] = r; d[i4 + 1] = g; d[i4 + 2] = b; d[i4 + 3] = a * 255;
        }
      }
      c.putImageData(img, 0, 0);

      // pine silhouettes along the two nearest ridges
      if (L.trees) {
        const rnd = rng(L.seed * 97 + 3), big = L.trees === 2;
        c.fillStyle = big ? '#04060d' : '#090e24';
        for (let x = rnd() * 6; x < Wl - 2; x += (big ? 3 : 2) + rnd() * (big ? 11 : 6)) {
          if (rnd() < .28) continue;
          const y = ys[Math.floor(x)] + 2;
          const hh = big ? 12 + rnd() * rnd() * 46 : 5 + rnd() * 12, w = hh * .3;
          const pts = [];
          for (let t = 1; t <= 4; t++) { const yy = y - hh + hh * t / 4, ww = w * t / 4; pts.push([ww, yy]); if (t < 4) pts.push([ww * .5, yy]); }
          c.beginPath(); c.moveTo(x, y - hh);
          pts.forEach(p => c.lineTo(x + p[0], p[1]));
          for (let k = pts.length - 1; k >= 0; k--) c.lineTo(x - pts[k][0], pts[k][1]);
          c.closePath(); c.fill();
        }
      }
      const bi = ((Hl - 1) * Wl + (Wl >> 1)) * 4;
      L.bot = `rgb(${d[bi]},${d[bi + 1]},${d[bi + 2]})`;
    });
  }

  let resizeTimer;
  function resize() {
    dpr = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    buildLayers();
  }
  addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(resize, 150); });
  resize();

  const stars = Array.from({ length: 260 }, () => {
    const r = Math.random;
    return { x: r(), y: r() * .75, s: r() * 1.3 + .3, p: r() * 6.28, sp: .5 + r() * 2 };
  });
  const mist = Array.from({ length: 7 }, (_, i) => ({ x: Math.random(), y: .5 + i * .07, w: .5 + Math.random() * .6, sp: (Math.random() - .5) * .012, a: .05 + Math.random() * .06 }));
  let shooting = null, nextShoot = 6000;

  addEventListener('pointermove', e => { mouseT = e.clientX / W - .5; });

  const ease = t => t < .5 ? 4 * t ** 3 : 1 - ((-2 * t + 2) ** 3) / 2;

  function rgba(c, a) { return `rgba(${c[0]},${c[1]},${c[2]},${a})`; }

  function drawSky(cam, t) {
    const shift = -cam * H * .06;
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#060a18');
    g.addColorStop(.45, '#121c3d');
    g.addColorStop(.72, '#3a4068');
    g.addColorStop(.9, '#b46b73');
    g.addColorStop(1, '#ffb877');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

    // dawn glow behind the main peak
    const gx = W * .62 + mouse * 10, gy = H * (.80) + shift;
    const glow = ctx.createRadialGradient(gx, gy, 0, gx, gy, H * .7);
    glow.addColorStop(0, 'rgba(255,200,140,.75)');
    glow.addColorStop(.25, 'rgba(255,150,120,.30)');
    glow.addColorStop(1, 'rgba(255,150,120,0)');
    ctx.fillStyle = glow; ctx.fillRect(0, 0, W, H);

    // stars
    for (const s of stars) {
      const tw = .55 + .45 * Math.sin(t * .001 * s.sp + s.p);
      const fade = 1 - Math.max(0, (s.y - .35) / .4);
      ctx.fillStyle = `rgba(238,243,248,${Math.max(0, tw * fade * .9)})`;
      ctx.fillRect(s.x * W + mouse * 6, s.y * H + shift, s.s, s.s);
    }

    // aurora ribbons
    ctx.save();
    ctx.globalCompositeOperation = 'screen';
    ctx.filter = 'blur(22px)';
    for (let i = 0; i < 3; i++) {
      const hue = [150, 175, 280][i];
      const grad = ctx.createLinearGradient(0, H * .05, 0, H * .5);
      grad.addColorStop(0, `hsla(${hue},85%,60%,0)`);
      grad.addColorStop(.5, `hsla(${hue},85%,60%,.30)`);
      grad.addColorStop(1, `hsla(${hue},85%,60%,0)`);
      ctx.fillStyle = grad;
      ctx.beginPath();
      const top = H * (.16 + i * .05) + shift * 1.2;
      ctx.moveTo(0, top + 200);
      for (let x = 0; x <= W; x += 24) {
        const y = top + Math.sin(x * .004 + t * .0003 * (1 + i * .3) + i * 2) * 50 + Math.sin(x * .011 - t * .0005) * 18;
        ctx.lineTo(x, y);
      }
      ctx.lineTo(W, top + 260); ctx.lineTo(0, top + 260);
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();

    // shooting star
    if (!reduce) {
      if (!shooting && t > nextShoot) {
        shooting = { x: W * (.2 + Math.random() * .5), y: H * (.05 + Math.random() * .2), life: 0 };
        nextShoot = t + 7000 + Math.random() * 8000;
      }
      if (shooting) {
        shooting.life += 16;
        const p = shooting.life / 900, x = shooting.x + p * 260, y = shooting.y + p * 110 + shift;
        const tg = ctx.createLinearGradient(x, y, x - 90, y - 38);
        tg.addColorStop(0, `rgba(255,255,255,${1 - p})`); tg.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.strokeStyle = tg; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - 90, y - 38); ctx.stroke();
        if (p >= 1) shooting = null;
      }
    }
  }

  function ridgeY(L, x, cam) {
    const i = Math.max(0, Math.min(L.ys.length - 1, Math.round(x + 200)));
    return L.ys[i] - cam * H * .55 * L.k;
  }

  function drawLayers(cam, t) {
    layers.forEach((L, i) => {
      const px = mouse * (8 + i * 14);
      const sy = -cam * H * .55 * L.k;
      ctx.drawImage(L.cv, -200 + px, sy);
      const bottom = sy + L.cv.height;
      if (bottom < H) { ctx.fillStyle = L.bot; ctx.fillRect(0, bottom - 1, W, H - bottom + 2); }

      // mist between ranges
      if (i < 4) {
        const my = ridgeY(L, W * .5, cam) + H * .08;
        mist.forEach((m, j) => {
          if (j % 4 !== i % 4 && !(i === 3 && j % 2)) return;
          const mx = ((m.x + t * m.sp * .0001 * 10) % 1.4 - .2) * W;
          const mg = ctx.createRadialGradient(mx, my + j * 6, 0, mx, my + j * 6, W * m.w * .5);
          mg.addColorStop(0, `rgba(190,205,230,${m.a + .04})`);
          mg.addColorStop(1, 'rgba(190,205,230,0)');
          ctx.save(); ctx.translate(0, my + j * 6); ctx.scale(1, .22); ctx.translate(0, -(my + j * 6));
          ctx.fillStyle = mg; ctx.fillRect(mx - W, my + j * 6 - W, W * 2, W * 2);
          ctx.restore();
        });
      }

      // headlamps of a hiking party climbing the 4th ridge
      if (i === 3) {
        const party = 4;
        for (let h = 0; h < party; h++) {
          const prog = ((t * .000018) + h * .012) % 1;
          const x = W * (.08 + prog * .55);
          const y = ridgeY(L, x, cam) - 2;
          const pulse = .7 + .3 * Math.sin(t * .004 + h);
          const hg = ctx.createRadialGradient(x + px, y, 0, x + px, y, 7);
          hg.addColorStop(0, `rgba(255,236,190,${.95 * pulse})`);
          hg.addColorStop(1, 'rgba(255,200,120,0)');
          ctx.fillStyle = hg; ctx.fillRect(x + px - 8, y - 8, 16, 16);
        }
      }
    });
  }

  let start = null, done = false;
  function frame(ts) {
    if (start === null) start = ts;
    const el = ts - start;
    const p = reduce ? 1 : Math.min(el / INTRO, 1);
    const cam = 1 - ease(p);
    mouse += (mouseT - mouse) * .05;

    drawSky(cam, ts);
    drawLayers(cam, ts);

    altEl.textContent = Math.round(ease(p) * MAX_ALT).toLocaleString('en-US');
    if (p >= 1 && !done) { done = true; document.body.classList.add('ready'); }
    if (!reduce || !done) requestAnimationFrame(frame);
    else requestAnimationFrame(frame);
  }
  if (reduce) { document.body.classList.add('ready'); }
  requestAnimationFrame(frame);

  // signup (front-end only for now: stores locally until a backend is connected)
  const form = document.getElementById('form'), email = document.getElementById('email'), thanks = document.getElementById('thanks');
  form.addEventListener('submit', e => {
    e.preventDefault();
    const v = email.value.trim();
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)) { thanks.textContent = 'Enter a valid email address.'; email.focus(); return; }
    try {
      const list = JSON.parse(localStorage.getItem('summit-waitlist') || '[]');
      if (!list.includes(v)) list.push(v);
      localStorage.setItem('summit-waitlist', JSON.stringify(list));
    } catch (_) {}
    thanks.textContent = "You're on the list. We'll email you before we open.";
    form.reset();
  });
})();
</script>
</body>
</html>
